[package]
name = "bambu-overlay"
version = "2.0.0"
edition = "2021"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
axum = "0.8"
bytes = "1.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
minijinja = "2.12"
native-tls = "0.2"
quick-xml = "0.40"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7.4"
rumqttc = { version = "0.25.1", default-features = false, features = ["use-native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
suppaftp = { version = "8.0.3", default-features = false, features = ["native-tls", "deprecated"] }
tokio = { version = "1.48", features = ["full"] }
tokio-native-tls = "0.3"
tokio-tungstenite = "0.24"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5.8"
uuid = { version = "1.18", features = ["v4"] }
x509-parser = "0.18"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tower = "0.5"
